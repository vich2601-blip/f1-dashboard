<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}F1 Dashboard{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Live Formula 1 dashboard with real-time standings, race results, and season calendar.{% endblock %}">

    <!-- PWA & Mobile -->
    <meta name="theme-color" content="#15151e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="F1 Dashboard">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}F1 Dashboard{% endblock %}">
    <meta property="og:description" content="Live Formula 1 dashboard with championship standings, race results, and season calendar.">

    <!-- Favicon (inline SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23e10600'/%3E%3Ctext x='4' y='24' font-family='Arial,sans-serif' font-weight='900' font-size='20' fill='white'%3EF1%3C/text%3E%3C/svg%3E">

    <!-- Fonts: Titillium Web (official F1 website font) + JetBrains Mono for timing data -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js — only loaded on pages that need it via block -->
    {% block head_scripts %}{% endblock %}

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- F1 Red Top Stripe -->
    <div class="f1-top-stripe"></div>

    {% include 'components/navbar.html' %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
